<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyectos de Marzo - Fielding School App</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <style>
        :root {
            --color-primary-green: #2D4F33;
            --color-accent-yellow: #E9A934;
            --color-bg-light: #F8F7F3;
            --color-text-dark: #333333;
            --color-white: #FFFFFF;
            --col-hist-bol: #d35400;   
            --col-hist-uni: #e67e22;
            --col-ingles: #2980b9;     
        }

        body { 
            font-family: 'Poppins', sans-serif; 
            margin: 0; 
            padding: 0; 
            background-color: var(--color-bg-light); 
            color: var(--color-text-dark); 
            padding-bottom: 80px; 
        }
        .container { width: 90%; max-width: 1200px; margin: 0 auto; }

        header { 
            background-color: var(--color-primary-green); 
            color: var(--color-white); 
            padding: 1.5rem 0; 
            border-radius: 0 0 30px 30px; 
            box-shadow: 0 4px 15px rgba(45, 79, 51, 0.2); 
            position: sticky; top: 0; z-index: 100; 
        }
        header h1 { font-size: 1.5rem; font-weight: 700; text-align: center; margin: 0; }
        header h1 span { color: var(--color-accent-yellow); font-weight: 400; font-size: 1.1rem; display: block; }

        .tabs-container { margin: 20px 0; background: white; padding: 15px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .tabs-menu { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: thin; }
        .tab-btn { padding: 10px 18px; border: none; border-radius: 20px; background: #eee; color: #555; font-weight: 600; cursor: pointer; white-space: nowrap; font-family: 'Poppins', sans-serif; transition: 0.3s; font-size: 0.85rem; }
        .tab-btn:hover { background: #e0e0e0; }
        .tab-btn.active { background: var(--color-accent-yellow); color: var(--color-white); box-shadow: 0 4px 10px rgba(233, 169, 52, 0.3); }

        .proyecto-tab { display: none; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .img-placeholder { width: 100%; height: 250px; background-color: #eaeaea; border: 3px dashed #bcbcbc; border-radius: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #888; margin-bottom: 25px; text-align: center; font-weight: 600; }
        .img-placeholder i { font-size: 2.5rem; margin-bottom: 10px; color: #aaa; }

        .content-card { background: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; border-left: 5px solid var(--color-primary-green); box-shadow: 0 5px 15px rgba(0,0,0,0.03); }
        .content-card h4 { color: var(--color-primary-green); margin-top: 0; margin-bottom: 10px; font-size: 1.1rem; }
        .content-card p, .content-card li { font-size: 0.95rem; color: #555; line-height: 1.6; }
        .content-card ul { margin-top: 0; padding-left: 20px; }

        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        th { background-color: var(--color-primary-green); color: white; padding: 12px 15px; text-align: left; font-size: 0.9rem; }
        td { padding: 12px 15px; border-bottom: 1px solid #eee; font-size: 0.9rem; color: #444; vertical-align: top; }
        tr:last-child td { border-bottom: none; }
        tr:nth-child(even) { background-color: #fcfcfc; }
        
        .student-list { list-style: none; padding: 0; margin: 0; }
        .student-list li { padding: 6px 0; border-bottom: 1px dashed #e0e0e0; display: flex; align-items: center; gap: 10px; font-size: 0.9rem; color: #555; }
        .student-list li:last-child { border-bottom: none; padding-bottom: 0; }
        .student-list i { color: var(--color-primary-green); opacity: 0.7; font-size: 0.85rem; }

        /* Loader */
        .loader-container { text-align: center; padding: 50px; color: var(--color-primary-green); }
        .spinner { border: 4px solid rgba(0,0,0,0.1); width: 40px; height: 40px; border-radius: 50%; border-left-color: var(--color-accent-yellow); animation: spin 1s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Mensaje de error personalizado */
        .error-msg { background-color: #ffebee; color: #c62828; padding: 20px; border-radius: 10px; border-left: 5px solid #c62828; margin: 20px; text-align: left;}
    </style>
</head>
<body>

    <header>
        <div class="container">
            <h1>FIELDING SCHOOL APP <span>Proyectos Mensuales</span></h1>
        </div>
    </header>

    <main class="container">
        
        <div class="tabs-container" id="menu-contenedor" style="display: none;">
            <h4 style="margin-top:0; color:#555; font-size: 0.9rem;"><i class="fa-solid fa-list"></i> Selecciona el curso y materia:</h4>
            <div class="tabs-menu" id="menu-pestanas">
                </div>
        </div>

        <div id="loader" class="loader-container">
            <div class="spinner"></div>
            <p>Conectando con la base de datos de los proyectos...</p>
        </div>

        <div id="contenido-pestanas">
            </div>

    </main>

    <script>
        // EL ENLACE EXACTO
        const urlGoogleSheetsCSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTPBlIdJrHoGAlqocOBuFVAamTJRXMwMpSxEz0W8hwVrsCAudV2IW7vtgoBnwi5wuQk4IMcGykwv5nb/pub?output=csv';

        let datosProyectos = [];

        document.addEventListener('DOMContentLoaded', () => {
            
            // Nuevo método nativo para evitar bloqueos
            fetch(urlGoogleSheetsCSV)
                .then(response => {
                    if (!response.ok) {
                        throw new Error("No se pudo contactar al servidor de Google Sheets.");
                    }
                    return response.text();
                })
                .then(csvText => {
                    Papa.parse(csvText, {
                        header: true,
                        complete: function(results) {
                            
                            if(results.data.length > 0 && !results.meta.fields.includes('id_pestana')) {
                                document.getElementById('loader').innerHTML = `
                                    <div class="error-msg">
                                        <strong>⚠️ Faltan las columnas correctas</strong><br><br>
                                        Tu documento se conectó con éxito, pero la primera fila de tu Excel no tiene los nombres que el sistema busca.<br><br>
                                        Asegúrate de que la Fila 1 diga exactamente: 
                                        <i>id_pestana, nombre_pestana, titulo_proyecto, fecha, objetivo, materiales, elaboracion, grupos</i>.
                                    </div>`;
                                return;
                            }

                            datosProyectos = results.data.filter(row => row.id_pestana && row.id_pestana.trim() !== ''); 
                            
                            if(datosProyectos.length === 0) {
                                 document.getElementById('loader').innerHTML = "<p style='color:#555;'>Conexión exitosa, pero el documento de Excel parece estar vacío.</p>";
                                 return;
                            }

                            construirInterfaz();
                        }
                    });
                })
                .catch(error => {
                    document.getElementById('loader').innerHTML = `
                        <div class="error-msg">
                            <strong>⚠️ Error de Conexión</strong><br><br>
                            Revisa que tu hoja de Excel esté publicada correctamente yendo a <b>Archivo > Compartir > Publicar en la web</b>.<br>
                            <i>Detalle: ${error.message}</i>
                        </div>`;
                });
        });

        function construirInterfaz() {
            const menuHtml = document.getElementById('menu-pestanas');
            const contenidoHtml = document.getElementById('contenido-pestanas');
            
            document.getElementById('loader').style.display = 'none';
            document.getElementById('menu-contenedor').style.display = 'block';

            datosProyectos.forEach((proyecto, index) => {
                const isActive = index === 0 ? 'active' : '';
                const displayStyle = index === 0 ? 'block' : 'none';
                
                menuHtml.innerHTML += `<button class="tab-btn ${isActive}" onclick="mostrarTab('${proyecto.id_pestana}', event)">${proyecto.nombre_pestana}</button>`;

                const listaMateriales = proyecto.materiales ? proyecto.materiales.split('\\n').join('\n').split('\n')
                                        .filter(mat => mat.trim() !== '')
                                        .map(mat => `<li>${mat}</li>`).join('') : '<li>Pendiente de actualización</li>';

                let tablaEstudiantesHtml = `<tr><td colspan="2" style="text-align: center; color: #888; padding: 20px;"><em>Las listas se actualizarán próximamente</em></td></tr>`;
                
                if (proyecto.grupos && proyecto.grupos.trim() !== '') {
                    const gruposArray = proyecto.grupos.split('|');
                    tablaEstudiantesHtml = '';
                    
                    gruposArray.forEach(grupoInfo => {
                        const partes = grupoInfo.split(':');
                        if(partes.length === 2) {
                            const nombreGrupo = partes[0].trim();
                            const estudiantes = partes[1].split(',').map(est => est.trim());
                            
                            let listaLis = estudiantes.map(est => `<li><i class="fa-regular fa-user"></i> ${est}</li>`).join('');
                            
                            tablaEstudiantesHtml += `
                                <tr>
                                    <td><strong>${nombreGrupo}</strong></td>
                                    <td><ul class="student-list">${listaLis}</ul></td>
                                </tr>
                            `;
                        }
                    });
                }

                let borderColor = 'var(--col-hist-uni)'; 
                if(proyecto.nombre_pestana && (proyecto.nombre_pestana.toLowerCase().includes('hb') || proyecto.nombre_pestana.toLowerCase().includes('bolivia'))) borderColor = 'var(--col-hist-bol)';
                if(proyecto.nombre_pestana && proyecto.nombre_pestana.toLowerCase().includes('ing')) borderColor = 'var(--col-ingles)';

                contenidoHtml.innerHTML += `
                <section id="${proyecto.id_pestana}" class="proyecto-tab" style="display: ${displayStyle};">
                    <h2 style="color: var(--color-primary-green);">${proyecto.titulo_proyecto || 'Proyecto'}</h2>
                    <p style="color: #666; font-weight: 600;"><i class="fa-regular fa-calendar"></i> Fecha de entrega: ${proyecto.fecha || 'Por definir'}</p>

                    <div class="img-placeholder">
                        <i class="fa-regular fa-image"></i>
                        <span>[ ESPACIO PARA IMAGEN DE REFERENCIA: ${proyecto.titulo_proyecto || 'Proyecto'} ]</span>
                    </div>

                    <div class="content-card" style="border-left-color: ${borderColor};">
                        <h4><i class="fa-solid fa-bullseye"></i> 1. Objetivo</h4>
                        <p>${proyecto.objetivo || 'Objetivos pendientes de actualización.'}</p>
                    </div>

                    <div class="content-card" style="border-left-color: ${borderColor};">
                        <h4><i class="fa-solid fa-box-open"></i> 2. Materiales Sugeridos</h4>
                        <ul>${listaMateriales}</ul>
                    </div>

                    <div class="content-card" style="border-left-color: ${borderColor};">
                        <h4><i class="fa-solid fa-hammer"></i> 3. Elaboración Sugerida</h4>
                        <p>${proyecto.elaboracion || 'Instrucciones pendientes de actualización.'}</p>
                    </div>
                    
                    <div class="content-card" style="border-left-color: ${borderColor};">
                        <h4><i class="fa-solid fa-users"></i> 4. Listado de Estudiantes</h4>
                        <div class="table-container">
                            <table>
                                <tr><th>Grupo</th><th>Integrantes del Equipo</th></tr>
                                ${tablaEstudiantesHtml}
                            </table>
                        </div>
                    </div>
                </section>
                `;
            });
        }

        function mostrarTab(tabId, evento) {
            const tabs = document.querySelectorAll('.proyecto-tab');
            tabs.forEach(tab => tab.style.display = 'none');
            
            const botones = document.querySelectorAll('.tab-btn');
            botones.forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(tabId).style.display = 'block';
            if(evento) evento.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>
