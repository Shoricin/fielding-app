<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fielding School App by Teacher Ivan</title>
    
    <link rel="manifest" href="./manifest.json">
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --color-primary-green: #2D4F33;
            --color-accent-yellow: #E9A934;
            --color-bg-light: #F8F7F3;
            --color-text-dark: #333333;
            --color-white: #FFFFFF;
            --border-radius-card: 20px;
            --border-radius-btn: 50px;
        }

        body { font-family: 'Poppins', sans-serif; margin: 0; padding: 0; background-color: var(--color-bg-light); color: var(--color-text-dark); padding-bottom: 80px; }
        .container { width: 90%; max-width: 1200px; margin: 0 auto; }

        header { background-color: var(--color-primary-green); color: var(--color-white); padding: 1.5rem 0; border-radius: 0 0 30px 30px; box-shadow: 0 4px 15px rgba(45, 79, 51, 0.2); position: sticky; top: 0; z-index: 100; }
        header h1 { font-size: 1.5rem; font-weight: 700; text-align: center; margin: 0; }
        header h1 span { color: var(--color-accent-yellow); font-weight: 400; font-size: 1.1rem; display: block; }

        .hero-login { padding: 4rem 1rem; text-align: center; }
        .login-box { background: var(--color-white); padding: 2.5rem; border-radius: var(--border-radius-card); box-shadow: 0 10px 30px rgba(0,0,0,0.08); max-width: 400px; margin: 2rem auto; border-top: 5px solid var(--color-accent-yellow); }
        .login-input { width: 100%; padding: 15px; margin-bottom: 20px; border: 2px solid #eee; border-radius: var(--border-radius-btn); font-family: 'Poppins'; font-size: 1rem; text-align: center; box-sizing: border-box; text-transform: uppercase; }
        .btn-primary { background-color: var(--color-accent-yellow); color: var(--color-primary-green); border: none; padding: 15px 40px; font-size: 1rem; font-weight: 700; border-radius: var(--border-radius-btn); cursor: pointer; width: 100%; transition: transform 0.2s; display: block; }
        
        .btn-whatsapp-login { display: flex; align-items: center; justify-content: center; gap: 10px; background-color: #25D366; color: white; text-decoration: none; font-weight: 600; padding: 12px 20px; border-radius: 50px; margin-top: 15px; font-size: 0.9rem; }
        .fab-whatsapp { position: fixed; bottom: 20px; right: 20px; background: #25D366; color: white; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 1000; text-decoration: none; }

        .subjects-grid { display: grid; grid-template-columns: 1fr; gap: 1.5rem; margin-top: 1.5rem; }
        .subject-card { background: var(--color-white); padding: 2rem; border-radius: var(--border-radius-card); text-align: center; border: 2px solid transparent; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: 0.2s; }
        .subject-card:active { transform: scale(0.98); }
        .card-icon { font-size: 2.5rem; color: var(--color-accent-yellow); margin-bottom: 1rem; background: #fff3d4; width: 70px; height: 70px; line-height: 70px; border-radius: 50%; margin: 0 auto 1.5rem auto; }

        .btn-back { background: transparent; border: none; color: #666; font-size: 1rem; cursor: pointer; display: flex; align-items: center; gap: 5px; margin-bottom: 15px; }
        .tabs-menu { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; }
        .tab-btn { flex: 1; padding: 10px 20px; border: none; border-radius: 30px; background: #eee; color: #555; font-weight: 600; cursor: pointer; white-space: nowrap; }
        .tab-btn.active { background: var(--color-accent-yellow); color: white; }

        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; }
        .cal-day { background: white; border-radius: 10px; height: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.9rem; border: 1px solid #f0f0f0; position: relative; }
        .cal-day.today { border: 2px solid var(--color-accent-yellow); font-weight: bold; }
        .dots { display: flex; gap: 3px; margin-top: 4px; justify-content: center; flex-wrap: wrap; }
        .dot { width: 6px; height: 6px; border-radius: 50%; }
        
        /* NUEVOS COLORES PARA EL CALENDARIO BASADOS EN EL TIPO DE EVENTO */
        .dot.evaluacion { background: #e74c3c; } 
        .dot.proyecto { background: #8e44ad; } 
        .dot.tarea { background: #f39c12; } 
        .dot.general { background: #27ae60; } 
        
        .content-card { background: white; padding: 20px; border-radius: 15px; margin-bottom: 15px; border-left: 5px solid var(--color-accent-yellow); box-shadow: 0 5px 15px rgba(0,0,0,0.03); }
        
        .btn-reminder { margin-top: 8px; background: #f0f0f0; border: none; padding: 8px 15px; border-radius: 20px; font-size: 0.8rem; cursor: pointer; color: var(--color-primary-green); display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }

        footer { text-align: center; padding: 2rem; color: #999; font-size: 0.8rem; }
    </style>
</head>
<body>

    <header>
        <div class="container">
            <h1>FIELDING SCHOOL APP <span>by Teacher Ivan</span></h1>
        </div>
    </header>

    <main>
        <section id="view-login" class="hero-login">
            <div class="container">
                <h2 style="color: var(--color-primary-green);">Portal de Padres</h2>
                <div class="login-box">
                    <i class="fa-solid fa-lock" style="font-size: 2rem; color: var(--color-accent-yellow); margin-bottom: 1rem;"></i>
                    <input type="text" id="input-code" class="login-input" placeholder="INGRESE CÓDIGO">
                    <button class="btn-primary" onclick="intentarLogin()">ACCEDER</button>
                    
                    <button id="btn-install" class="btn-primary" style="display: none; background-color: var(--color-primary-green); color: white; margin-top: 15px;">
                        <i class="fa-solid fa-download"></i> INSTALAR APP EN EL CELULAR
                    </button>

                    <a href="https://wa.me/59172878330" target="_blank" class="btn-whatsapp-login">
                        <i class="fa-brands fa-whatsapp"></i> ¿Problemas? Contactar
                    </a>
                    <p id="msg-status" style="font-size: 0.8rem; color: #999; margin-top: 1rem;">Conectando...</p>
                </div>
            </div>
        </section>

        <section id="view-dashboard" style="display:none; padding: 2rem 0;">
            <div class="container">
                <div id="student-profile" style="background: white; padding: 1.5rem; border-radius: var(--border-radius-card); box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; margin-bottom: 1.5rem; border-top: 5px solid var(--color-primary-green);">
                    <i class="fa-solid fa-user-graduate" style="font-size: 2.5rem; color: var(--color-accent-yellow); margin-bottom: 10px;"></i>
                    <h2 id="profile-name" style="margin: 0; color: var(--color-primary-green); font-size: 1.3rem;">-</h2>
                    <p id="profile-course" style="margin: 5px 0 0 0; color: #666; font-size: 0.9rem; font-weight: bold;">-</p>
                </div>

                <div class="subject-card" onclick="window.location.href='PROYECTOSMENSUALES.html'" style="background: var(--color-primary-green); border: none; padding: 1.5rem; margin-bottom: 2rem;">
                    <h3 style="color: white; margin: 0;"><i class="fa-solid fa-list-check" style="color: var(--color-accent-yellow);"></i> PROYECTOS MENSUALES</h3>
                    <p style="color: rgba(255,255,255,0.7); margin: 5px 0 0 0; font-size: 0.85rem;">Instrucciones y grupos</p>
                </div>

                <h3 style="color: var(--color-primary-green); text-align: center; margin-bottom: 10px;">Mis Materias Activas</h3>
                <div id="grid-materias" class="subjects-grid"></div>
            </div>
        </section>

        <section id="view-detail" style="display:none; padding: 2rem 0;">
            <div class="container">
                <button class="btn-back" onclick="volverAlDashboard()">
                    <i class="fa-solid fa-arrow-left"></i> VOLVER A MATERIAS
                </button>
                
                <h2 id="materia-titulo" style="color: var(--color-primary-green); margin-top: 0;">Materia</h2>
                <p id="materia-subtitulo" style="color: #666; margin-top: -10px; margin-bottom: 20px;"></p>
                
                <div class="tabs-menu">
                    <button class="tab-btn active" onclick="verTab('contenidos')">Contenidos</button>
                    <button class="tab-btn" onclick="verTab('calendario')">Calendario</button>
                    <button class="tab-btn" onclick="verTab('notificaciones')">Notificaciones</button>
                    <button class="tab-btn" onclick="window.location.href='PROYECTOSMENSUALES.html'" style="background: var(--color-primary-green); color: white;">Proyectos</button>
                </div>

                <div id="tab-contenidos"></div>
                <div id="tab-calendario" style="display:none">
                    <div class="cal-header">
                        <button class="btn-back" onclick="cambiarMes(-1)" style="margin:0"><i class="fa-solid fa-chevron-left"></i></button>
                        <strong id="cal-mes-anio">MES</strong>
                        <button class="btn-back" onclick="cambiarMes(1)" style="margin:0"><i class="fa-solid fa-chevron-right"></i></button>
                    </div>
                    <div class="cal-grid"><small>D</small><small>L</small><small>M</small><small>M</small><small>J</small><small>V</small><small>S</small></div>
                    <div id="cal-dias" class="cal-grid"></div>
                    
                    <div style="margin-top:20px; font-size:0.75rem; color:#666; display:flex; flex-wrap:wrap; gap:10px; justify-content:center;">
                        <span style="display:flex; align-items:center; gap:5px"><span class="dot evaluacion"></span> Evaluación</span>
                        <span style="display:flex; align-items:center; gap:5px"><span class="dot proyecto"></span> Entrega de proyecto mensual</span>
                        <span style="display:flex; align-items:center; gap:5px"><span class="dot tarea"></span> Tarea</span>
                    </div>

                    <div id="cal-detalle" style="margin-top:20px; display:none;"></div>
                </div>
                <div id="tab-notificaciones" style="display:none"></div>
            </div>
        </section>
    </main>

    <footer><p>© 2026 Teacher Ivan - Colegio Fielding</p></footer>

    <script>
        const SHEET_ID = '1Xg9v3_2thiMC31HTFt4docqPzUrL4U5xozX0if7Bswk';
        const TABS = {
            notas: 'REGISTRO_NOTAS',
            calendario: 'DATA_CALENDARIO',
            contenido: 'CONTENIDOS_MENSUALES',
            notificaciones: 'DATA_NOTIFICACIONES'
        };

        const DB = { notas: [], calendario: [], contenido: [], notificaciones: [], misMaterias: [] };
        const APP = { materia: null, student: null, course: null, fechaCal: new Date() };

        window.onload = function() {
            cargarHoja(TABS.notas, 'cbNotas');
            cargarHoja(TABS.calendario, 'cbCalendario');
            cargarHoja(TABS.contenido, 'cbContenido');
            cargarHoja(TABS.notificaciones, 'cbNotificaciones');
        };

        function cargarHoja(nombre, callback) {
            const s = document.createElement('script');
            s.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=responseHandler:${callback}&sheet=${encodeURIComponent(nombre)}&tq=select%20*`;
            document.body.appendChild(s);
        }

        window.cbNotas = (j) => procesar(j, 'notas');
        window.cbCalendario = (j) => procesar(j, 'calendario');
        window.cbContenido = (j) => procesar(j, 'contenido');
        window.cbNotificaciones = (j) => procesar(j, 'notificaciones');

        function procesar(json, tipo) {
            if (!json || !json.table) return;
            let headers = json.table.cols.map(c => c.label ? c.label.trim().toUpperCase() : '');
            let rows = json.table.rows;
            if (headers.filter(h => h !== '').length === 0 && rows.length > 0) {
                headers = rows[0].c.map(celda => (celda && celda.v) ? String(celda.v).trim().toUpperCase() : '');
                rows = rows.slice(1);
            }
            DB[tipo] = rows.map(r => {
                let obj = {};
                r.c.forEach((celda, i) => {
                    const key = headers[i] || ('COL' + i);
                    obj[key] = (celda && celda.v !== null) ? String(celda.v) : "";
                });
                return obj;
            });
            if(tipo === 'notas') document.getElementById('msg-status').innerText = "Listo.";
        }

        window.intentarLogin = function() {
            const code = document.getElementById('input-code').value.trim().toUpperCase();
            DB.misMaterias = DB.notas.filter(row => {
                const k = Object.keys(row).find(key => key.includes('CODIGO'));
                return row[k] && row[k].toUpperCase() === code;
            });
            if(DB.misMaterias.length > 0) {
                APP.student = buscar(DB.misMaterias[0], 'ESTUDIANTE');
                APP.course = buscar(DB.misMaterias[0], 'CURSO');
                mostrarDashboard();
            } else { alert("Código no encontrado."); }
        }

        window.mostrarDashboard = function() {
            cambiarVista('view-dashboard');
            document.getElementById('profile-name').innerText = APP.student;
            document.getElementById('profile-course').innerText = APP.course;
            const grid = document.getElementById('grid-materias');
            grid.innerHTML = '';
            DB.misMaterias.forEach((m, i) => {
                const mat = buscar(m, 'MATERIA');
                grid.innerHTML += `<div class="subject-card" onclick="abrirMateria(${i})">
                    <div class="card-icon"><i class="fa-solid fa-book"></i></div>
                    <h3>${mat}</h3><p>${APP.course}</p></div>`;
            });
        }

        window.abrirMateria = function(index) {
            APP.materia = DB.misMaterias[index];
            cambiarVista('view-detail');
            document.getElementById('materia-titulo').innerText = buscar(APP.materia, 'MATERIA');
            document.getElementById('materia-subtitulo').innerText = APP.course;
            verTab('contenidos');
            renderContenidos(); renderCalendario(); renderNotificaciones();
        }

        function renderContenidos() {
            const div = document.getElementById('tab-contenidos');
            const temas = DB.contenido.filter(t => {
                const tCur = limpiar(buscar(t, 'CURSO') || buscar(t, 'NIVEL'));
                const tMat = limpiar(buscar(t, 'MATERIA'));
                return (tCur.includes(limpiar(APP.course)) || limpiar(APP.course).includes(tCur)) && 
                       (tMat.includes(limpiar(buscar(APP.materia, 'MATERIA'))));
            });
            div.innerHTML = temas.length ? temas.map(t => `<div class="content-card"><h4>${buscar(t, 'TITULO')}</h4><p>${buscar(t, 'DESCRIPCION')}</p></div>`).join('') : '<p>No hay contenidos.</p>';
        }

        function renderNotificaciones() {
            const div = document.getElementById('tab-notificaciones');
            const notifs = DB.notificaciones.filter(n => {
                const dest = limpiar(buscar(n, 'CURSO_DESTINO') || buscar(n, 'CURSO') || '');
                return dest === '' || dest.includes(limpiar(APP.course)) || limpiar(APP.course).includes(dest);
            });
            
            div.innerHTML = notifs.length ? notifs.map(n => {
                // LIMPIEZA DE LA FECHA PARA QUE SE VEA PERFECTA
                let fechaDisplay = buscar(n, 'FECHA');
                const pObj = parsearFecha(fechaDisplay);
                if(pObj) {
                    fechaDisplay = `${String(pObj.dia).padStart(2,'0')}/${String(pObj.mes+1).padStart(2,'0')}/${pObj.anio}`;
                }

                return `
                <div class="content-card">
                    <div style="font-size:0.75rem; color:#888; display:flex; justify-content:space-between; margin-bottom:5px;">
                        <span style="color:var(--color-primary-green); font-weight:bold; text-transform:uppercase;"><i class="fa-solid fa-bell"></i> ${buscar(n, 'TIPO')}</span>
                        <span>${fechaDisplay}</span>
                    </div>
                    <strong style="font-size:1.05rem; display:block; margin-bottom:5px;">${buscar(n, 'TITULO')}</strong>
                    <p style="margin-top:0;">${buscar(n, 'DETALLE')}</p>
                    <button class="btn-reminder" onclick="agendar('${buscar(n, 'TITULO')}', '${buscar(n, 'DETALLE')}', '${buscar(n, 'FECHA')}')">
                        <i class="fa-solid fa-calendar-plus"></i> Recordar en Celular
                    </button>
                </div>`
            }).join('') : '<p>Sin notificaciones.</p>';
        }

        window.agendar = function(t, d, f) {
            const p = parsearFecha(f);
            if(!p) return alert("Fecha inválida.");
            const dateStr = `${p.anio}${String(p.mes+1).padStart(2,'0')}${String(p.dia).padStart(2,'0')}`;
            const ics = `BEGIN:VCALENDAR\nVERSION:2.0\nBEGIN:VEVENT\nDTSTART;VALUE=DATE:${dateStr}\nSUMMARY:${t}\nDESCRIPTION:${d}\nEND:VEVENT\nEND:VCALENDAR`;
            const blob = new Blob([ics], { type: 'text/calendar' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = 'evento.ics'; a.click();
        }

        // LÓGICA DE ASIGNACIÓN DE COLOR SEGÚN TIPO DE EVENTO
        function obtenerClaseColor(ev) {
            const tipo = (ev.tipo || '').toLowerCase();
            const titulo = (ev.titulo || '').toLowerCase();
            
            if (titulo.includes('entrega') || titulo.includes('proyecto')) return 'proyecto';
            if (tipo.includes('evaluaci') || titulo.includes('examen') || titulo.includes('defensa')) return 'evaluacion';
            if (tipo.includes('tarea') || titulo.includes('taller')) return 'tarea';
            
            return 'general';
        }

        function renderCalendario() {
            const grid = document.getElementById('cal-dias');
            grid.innerHTML = '';
            const year = APP.fechaCal.getFullYear(), month = APP.fechaCal.getMonth();
            document.getElementById('cal-mes-anio').innerText = `${new Intl.DateTimeFormat('es', {month:'long'}).format(APP.fechaCal)} ${year}`.toUpperCase();
            const firstDay = new Date(year, month, 1).getDay(), days = new Date(year, month + 1, 0).getDate();
            
            // Solo los eventos filtrados por materia activa aparecen en su propio calendario
            const evsExcel = DB.calendario.filter(e => {
                const mat = limpiar(buscar(e, 'MATERIA'));
                const matAlumno = limpiar(buscar(APP.materia, 'MATERIA'));
                const curAlumno = limpiar(APP.course);
                const dest = limpiar(buscar(e, 'DESTINO') || buscar(e, 'CURSO_DESTINO'));
                
                const matchCurso = dest === '' || dest.includes(curAlumno) || curAlumno.includes(dest);
                const matchMateria = mat === '' || mat.includes(matAlumno) || matAlumno.includes(mat) || (matAlumno.includes('histo') && mat.includes('histo'));
                return matchCurso && matchMateria;
            }).map(e => ({fecha: buscar(e, 'FECHA'), titulo: buscar(e, 'EVENTO'), tipo: buscar(e, 'TIPO'), detalle: buscar(e, 'DETALLE')}));
            
            for(let i=0; i<firstDay; i++) grid.innerHTML += '<div></div>';
            for(let d=1; d<=days; d++) {
                const evs = evsExcel.filter(e => { const p = parsearFecha(e.fecha); return p && p.dia === d && p.mes === month && p.anio === year; });
                const dots = evs.map(e => `<div class="dot ${obtenerClaseColor(e)}"></div>`).join('');
                
                const div = document.createElement('div');
                div.className = `cal-day ${evs.length?'has-event':''}`;
                div.innerHTML = `<span>${d}</span><div class="dots">${dots}</div>`;
                if(evs.length > 0) div.onclick = () => mostrarEvento(d, evs);
                grid.appendChild(div);
            }
        }

        function mostrarEvento(dia, eventos) {
            const box = document.getElementById('cal-detalle');
            box.style.display = 'block';
            box.innerHTML = `<strong>Día ${dia}:</strong>` + eventos.map(e => {
                const color = obtenerClaseColor(e);
                return `
                <div style="margin-top:10px; padding-top:10px; border-top:1px dashed #eee; display:flex; gap:10px; align-items:flex-start;">
                    <div class="dot ${color}" style="margin-top:6px; flex-shrink:0;"></div>
                    <div style="flex:1">
                        <div style="color:var(--color-primary-green); font-weight:600; font-size:0.95rem;">${e.titulo}</div>
                        <div style="font-size:0.8rem; color:#666;">${e.tipo}</div>
                        ${e.detalle ? `<div style="font-size:0.8rem; color:#444; margin-top:3px; background:#f5f5f5; padding:5px; border-radius:5px;">📝 ${e.detalle}</div>` : ''}
                    </div>
                </div>`;
            }).join('');
        }

        function parsearFecha(f) {
            if(!f) return null;
            if(f.indexOf('Date') >= 0) { const n = f.match(/(\d+)/g); return { anio: +n[0], mes: +n[1], dia: +n[2] }; }
            const n = f.match(/(\d+)/g);
            if(!n || n.length < 3) return null;
            return n[0] > 1000 ? { anio: +n[0], mes: +n[1]-1, dia: +n[2] } : { anio: +n[2], mes: +n[1]-1, dia: +n[0] };
        }

        function buscar(obj, keyPart) { const key = Object.keys(obj).find(k => k.includes(keyPart.toUpperCase())); return key ? obj[key] : ""; }
        function limpiar(s) { return s ? s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\./g, "").toLowerCase().trim() : ""; }
        function cambiarVista(id) { ['view-login', 'view-dashboard', 'view-detail'].forEach(v => document.getElementById(v).style.display = 'none'); document.getElementById(id).style.display = 'block'; }
        window.verTab = function(id) { ['contenidos', 'calendario', 'notificaciones'].forEach(t => document.getElementById('tab-'+t).style.display = 'none'); document.getElementById('tab-'+id).style.display = 'block'; document.querySelectorAll('.tab-btn').forEach(b => { b.classList.remove('active'); if(b.innerText.toLowerCase().includes(id.slice(0,3))) b.classList.add('active'); }); }
        window.cambiarMes = (n) => { APP.fechaCal.setMonth(APP.fechaCal.getMonth() + n); renderCalendario(); }
        window.volverAlDashboard = () => cambiarVista('view-dashboard');
    </script>
    
    <script>
        let deferredPrompt;
        const installBtn = document.getElementById('btn-install');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'block'; // Mostrar botón de instalar
        });

        installBtn.addEventListener('click', () => {
            installBtn.style.display = 'none';
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then((choiceResult) => {
                if (choiceResult.outcome === 'accepted') {
                    console.log('App instalada en el dispositivo');
                }
                deferredPrompt = null;
            });
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then(reg => {
                    reg.onupdatefound = () => {
                        const installingWorker = reg.installing;
                        installingWorker.onstatechange = () => {
                            if (installingWorker.state === 'installed') {
                                if (navigator.serviceWorker.controller) {
                                    console.log('Nueva versión encontrada. Recargando...');
                                    window.location.reload();
                                }
                            }
                        };
                    };
                });
            });
        }
    </script>
</body>
